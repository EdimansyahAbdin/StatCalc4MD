      <div style="font-family:Georgia,serif;max-width:780px;margin:0 auto;padding:40px 20px;color:#1e293b;background:#fff;">
        <h1>StatCalc MD — Free Sample Size Calculator for Medical Research</h1>
        <p>StatCalc MD is a free online sample size and power analysis calculator designed for medical researchers, clinicians, and biostatistics students. All calculations run locally in your browser with no data collection.</p>

        <h2>26 Study Designs for Sample Size &amp; Power Calculation</h2>
        <h3>Means &amp; t-tests</h3>
        <ul>
          <li>Two independent means (parallel group RCT, continuous outcome)</li>
          <li>Paired / matched means (crossover, before-after)</li>
          <li>One-sample mean (vs. known reference value)</li>
        </ul>
        <h3>Proportions &amp; Binary Outcomes</h3>
        <ul>
          <li>Two independent proportions (RCT binary primary endpoint)</li>
          <li>One-sample proportion (vs. known p₀)</li>
          <li>Paired proportions — McNemar test</li>
          <li>Chi-square test (goodness-of-fit, independence)</li>
          <li>Non-inferiority trial — proportions</li>
        </ul>
        <h3>ANOVA Designs</h3>
        <ul>
          <li>One-way ANOVA (k independent groups)</li>
          <li>Two-way ANOVA (factorial design with interaction)</li>
          <li>Repeated measures ANOVA (within-subjects)</li>
          <li>ANCOVA (covariate-adjusted group comparison)</li>
        </ul>
        <h3>Regression &amp; Correlation</h3>
        <ul>
          <li>Pearson correlation (H₀: ρ = 0, Fisher z-transform)</li>
          <li>Comparing two independent correlations</li>
          <li>Simple linear regression (slope test)</li>
          <li>Multiple regression R² (Cohen f²)</li>
          <li>Logistic regression (Hsieh, Bloch &amp; Larsen method)</li>
        </ul>
        <h3>Survival Analysis</h3>
        <ul>
          <li>Log-rank test (Schoenfeld 1981 formula)</li>
          <li>Cluster RCT — log-rank (survival with ICC adjustment)</li>
          <li>Cox proportional hazards regression</li>
        </ul>
        <h3>Clinical Trials &amp; Equivalence</h3>
        <ul>
          <li>Equivalence trial — TOST (two one-sided tests)</li>
        </ul>
        <h3>Diagnostic Studies</h3>
        <ul>
          <li>ICC — intra-class correlation for reliability studies</li>
        </ul>
        <h3>Phase II Oncology</h3>
        <ul>
          <li>Simon two-stage design (optimal and minimax)</li>
        </ul>
        <h3>Survey &amp; Epidemiology</h3>
        <ul>
          <li>Survey prevalence / proportion (with design effect DEFF)</li>
          <li>Survey mean estimation</li>
        </ul>
        <h3>SEM &amp; Mediation</h3>
        <ul>
          <li>Structural equation model — RMSEA-based power (MacCallum et al. 1996, semPower)</li>
          <li>Simple mediation — Sobel test</li>
        </ul>

        <h2>Key Features</h2>
        <ul>
          <li><strong>Manuscript paragraph generator</strong> — ready-to-paste sample size justification with embedded textbook citations and page numbers</li>
          <li><strong>Verified replication code</strong> — R, Stata, and SAS commands to independently confirm every calculation</li>
          <li><strong>12 authoritative references</strong> — Cohen (1988), Aberson (2019), Machin et al. (2009), Chow et al. (2008), Zhang &amp; Yuan (2018) WebPower, Jak et al. (2020) power4SEM, Moshagen &amp; Bader (2024) semPower, Valliant et al. (2013), Aday &amp; Cornelius (2006), Fleiss et al. (2003), Stata PSS Manual (2023), SAS PROC POWER (2015)</li>
          <li><strong>WhatsApp share &amp; PDF export</strong> of results</li>
          <li><strong>Offline capable</strong> — works without internet after first load (Progressive Web App)</li>
          <li><strong>iPhone optimised</strong> — mobile-first layout for use at the bedside</li>
          <li><strong>No account required</strong> — completely free, no sign-in, no data collection</li>
        </ul>

        <h2>About</h2>
        <p>StatCalc MD was developed by <strong>Dr. Edimansyah Abdin</strong>, Principal Biostatistician at the Institute of Mental Health (IMH), Singapore. It is intended for use in clinical research protocol writing, ethics committee submissions, and biostatistics education.</p>
