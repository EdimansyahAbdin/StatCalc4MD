<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>StatCalc MD</title>
  <script>
    // GitHub Pages 404 redirect trick for SPAs
    // Redirects /statcalc-md/anything back to /statcalc-md/
    const path = window.location.pathname;
    const base = '/statcalc-md/';
    if (!path.startsWith(base) || path === base) {
      window.location.replace(base);
    } else {
      window.location.replace(base);
    }
  </script>
</head>
<body>Redirecting...</body>
</html>
